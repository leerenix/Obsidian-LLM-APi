[project]
name = "obsidian-llm-assistant"
version = "0.1.0"
description = "An LLM assistant for Obsidian vaults."
authors = [{ name = "Jules", email = "jules@example.com" }]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["fastapi>=0.121.1", "uvicorn>=0.38.0", "sqlalchemy>=2.0.44", "langchain>=1.0.5", "langchain-openai>=1.0.2", "requests>=2.32.5", "python-dotenv>=1.2.1", "playwright>=1.56.0", "websockets>=15.0.1"]

[tool.pdm]
[tool.pdm.dev-dependencies]
dev = [
    "ruff",
]

[tool.pdm.scripts]
start = "uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
